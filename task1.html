<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef6ff;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            color: #1769aa;
            margin-bottom: 25px;
        }

        input {
            width: 300px;
            padding: 12px;
            border: 2px solid #4da3df;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        input:focus {
            border-color: #1769aa;
        }

        button {
            padding: 12px 20px;
            margin-left: 8px;
            background-color: #1769aa;
            color: white;
            border: 2px solid #1769aa;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background-color: #0d5b96;
        }

        #listTask {
            width: 500px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border: 2px solid #4da3df;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            text-align: left;
        }

        #listTask p {
            padding: 12px;
            margin: 10px 0;
            background-color: #e8f4ff;
            border-left: 5px solid #1769aa;
            border-radius: 6px;
        }
    </style>

</head>

<body>

    <h1>TO-DO-LIST</h1>

    <input type="text" id="inputText" placeholder="please enter task name">
    <button id="addButton">Add Task</button>

    <br><br>

    <div id="listTask">
    </div>

    <script src="task1.js"></script>

</body>
</html>
